# Warm-start-specific FINETUNE configuration.
#
# Loaded automatically after finetune.yaml when running:
#   python scripts_mast/run_finetune.py --init warmstart ...

embeddings:
  impute_na: true

  # Per-role embedding policy:
  # - tune: learn DCT3D rank coefficients in this run
  # - source: inherit DCT3D rank coefficients from model_source.run_dir
  # - config: use config/profile defaults without tuning or source artifacts
  # Warmstart keeps input/actuator embeddings aligned with the source model and retunes task outputs.
  role_mode:
    input: source
    actuator: source
    output: tune

  tuning:
    guardrails:
      enable: true

    objective:
      thresholds:
        output: 0.999
      max_budget:
        output: 8192

train:
  # Run-level behavior (not per-stage).
  resume: false

  early_stop:
    patience: 10
    delta: 0.0

  amp:
    enable: true

  loss:
    output_weights:
#      summary-ip: 1.2

    terms:
      - type: embed_mse
        weight: 1.0
#      - type: native_sparse_mse   # data.keep_output_native is set automatically when this term is present
#        weight: 0.5

  optimizer:
    use_adamw: true

  stages:
    - name: ft_heads
      epochs: 5

      scheduler:
        grad_accum_steps: 1
        warmup_steps_fraction: 0.02

      optimizer:
        lr:
          token_encoder: 0.0
          backbone: 0.0
          modality_heads: 1e-3
          output_adapters: 5e-3
        wd:
          token_encoder: 0.0
          backbone: 0.0
          modality_heads: 0.01
          output_adapters: 0.01

      freeze:
        token_encoder: true
        backbone: true
        modality_heads: false
        output_adapters: false

    - name: ft_full
      epochs: 15

      scheduler:
        grad_accum_steps: 1
        warmup_steps_fraction: 0.02

      optimizer:
        lr:
          token_encoder: 5e-4
          backbone: 5e-4
          modality_heads: 1e-3
          output_adapters: 5e-3
        wd:
          token_encoder: 0.01
          backbone: 0.01
          modality_heads: 0.01
          output_adapters: 0.01

      freeze:
        token_encoder: false
        backbone: false
        modality_heads: false
        output_adapters: false


# Warmstart source is provided by CLI: --init warmstart --model <run_id_or_path>.
model_source:
  load_parts:
    token_encoder: true
    backbone: true
    modality_heads: true
    output_adapters: false

# Warmstart: model = deep_merge(source_model, model_overrides)
model_overrides:
  output_adapters:
    hidden_dim:
      default: 0

      bucketed:
        enable: true
        rules:
          - {max_out_dim: 64, hidden: 0}
          - {max_out_dim: 512, hidden: 32}
          - {max_out_dim: 4096, hidden: 64}
          - {max_out_dim: 8192, hidden: 128}
          - {max_out_dim: null, hidden: d_model}

      manual: {}  # {output_name: hidden_int, ...} (always wins)
