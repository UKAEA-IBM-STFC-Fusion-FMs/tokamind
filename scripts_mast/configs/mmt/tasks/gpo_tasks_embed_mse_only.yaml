        shot_blacklist: [18492, 14357, 17044, 12667, 15359, 16180, 15767, 15524, 14433, 12898,
                         20575, 20839, 14383, 17048, 17412]
      loss:
        terms:
          - type: embed_mse
            weight: 1.0
      stages:
        - name: gpo
          epochs: 10
          scheduler:
            grad_accum_steps: 1
            warmup_steps_fraction: 0.05
          optimizer:
            lr:
              token_encoder: 5e-4
              backbone: 1e-4
              modality_heads: 5e-4
              output_adapters: 5e-4
            wd:
              token_encoder: 0.01
