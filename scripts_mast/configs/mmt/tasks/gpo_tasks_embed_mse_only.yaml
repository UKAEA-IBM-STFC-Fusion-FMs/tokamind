# MSE-only CGPO ablation recipes for task_4-1 through task_4-5.
# Only embed_mse contributes to the training objective; no preference/reference term is used.
# Select this READ-ONLY input via GPO_TASKS_YAML during calibration. The launcher passes
# the generated per-run recipe to training; use matching settings/tags for comparison.
# Source preprocessing/split still take precedence over the historical task entries below.
# An MSE-only improvement alone does not identify the cause of a CGPO failure.
# See docs/gpo_runbook.md for immutable calibration, verified evaluation and migration.

tasks:

  # ---------------------------------------------------------------------------
  # task_4-1
  # ---------------------------------------------------------------------------
  task_4-1:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 64
    train:
      use_reference_model: false   # no reference needed without GPO term
      gpo_dataset:
        shot_blacklist: [18675, 14013, 14342]
      loss:
        terms:
          - type: embed_mse
            weight: 1.0
      stages:
        - name: gpo
          epochs: 5
          scheduler:
            grad_accum_steps: 1
            warmup_steps_fraction: 0.1
          optimizer:
            lr:
              token_encoder: 5e-4
              backbone: 1e-4
              modality_heads: 5e-4
              output_adapters: 5e-4
            wd:
              token_encoder: 0.01
              backbone: 0.01
              modality_heads: 0.01
              output_adapters: 0.01
          freeze:
            token_encoder: true
            backbone: true
            modality_heads: false
            output_adapters: false

  # ---------------------------------------------------------------------------
  # task_4-2
  # ---------------------------------------------------------------------------
  task_4-2:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 256
    train:
      use_reference_model: false
      gpo_dataset:
        shot_blacklist: [18675, 14013, 14342]
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # ---------------------------------------------------------------------------
  # task_4-3
  # ---------------------------------------------------------------------------
  task_4-3:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 256
    train:
      use_reference_model: false
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # ---------------------------------------------------------------------------
  # task_4-4
  # ---------------------------------------------------------------------------
  task_4-4:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 256
    train:
      use_reference_model: false
      gpo_dataset:
        shot_blacklist: [18492, 14357, 17044, 12667, 15359, 16180, 15767, 15524, 14433, 12898,
                         20575, 20839, 14383, 17048, 17412]
      loss:
        terms:
          - type: embed_mse
            weight: 1.0
      stages:
        - name: gpo
          epochs: 10
          scheduler:
            grad_accum_steps: 1
            warmup_steps_fraction: 0.05
          optimizer:
            lr:
              token_encoder: 5e-4
              backbone: 1e-4
              modality_heads: 5e-4
              output_adapters: 5e-4
            wd:
              token_encoder: 0.01
              backbone: 0.01
              modality_heads: 0.01
              output_adapters: 0.01
          freeze:
            token_encoder: true
            backbone: true
            modality_heads: false
            output_adapters: false

  # ---------------------------------------------------------------------------
