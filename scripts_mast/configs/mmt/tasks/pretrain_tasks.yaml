# Task-specific PRETRAIN overrides.
# Omit tasks that use the shared defaults unchanged.

tasks:
  _test:
    model:
      output_adapters:
        hidden_dim:
          default: 0
          bucketed:
            enable: true
            rules:
              - {max_out_dim: 64, hidden: 0}
              - {max_out_dim: 512, hidden: 32}
              - {max_out_dim: 4096, hidden: 64}
              - {max_out_dim: 8192, hidden: 128}
              - {max_out_dim: null, hidden: d_model}
          manual: {}
