# Task-specific evaluation overrides. Evaluation otherwise uses every valid
# window from the shared phase configuration.

tasks:

  # Match the group-4 finetuning batch size. These long-horizon MHD targets
  # have substantially larger native and embedded output tensors.

  task_4-1: &task_4_eval
    loader:
      batch_size: 256

  task_4-2:
    <<: *task_4_eval

  task_4-3:
    <<: *task_4_eval

  task_4-4:
    <<: *task_4_eval

  task_4-5:
    <<: *task_4_eval


  # ---------------------------------------------------------------------------
  # Groups 1 and 2 — GPO stream tasks
  # ---------------------------------------------------------------------------

  task_1-1: &task_12_gpo_eval {}

  task_2-2:
    <<: *task_12_gpo_eval

  task_2-3:
    <<: *task_12_gpo_eval
