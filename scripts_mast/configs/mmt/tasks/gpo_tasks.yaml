# CGPO task recipes. Source representation and official shot split remain authoritative.
# These beta/blacklist values are historical starting points, not validated optima.
# Create an immutable per-run calibration artifact before training; never patch this file from a job.
# Reference subtracts a fixed relative-distance margin; it does not enforce a KL bound.
# DPO has derivative -beta/2 at zero margin. IPO penalizes margin overshoot but not orthogonal drift.
# embed_mse softly anchors all valid windows; sft_weight anchors only paired windows.
# Clip/log collection-gap transforms are incompatible with use_reference_model=true.

tasks:

  task_4-1:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 64
    train:
      gpo_dataset:
        shot_blacklist: [18675, 14013, 14342]
        native_nrmse_percentiles: [25.0, 95.0]
        max_pairs_per_shot_percentile: 90.0
      loss:
        terms:
          - type: continuous_gpo
            weight: 1.0
            beta: 10.0
            loss_type: ipo
            sft_weight: 0.0
          - type: embed_mse
            weight: 0.2
      stages:
        - name: gpo
          epochs: 200
          scheduler:
            grad_accum_steps: 1
            warmup_steps_fraction: 0.1
          optimizer:
            lr:
              token_encoder: 5e-4
              backbone: 1e-4
              modality_heads: 1e-4
              output_adapters: 1e-4
            wd:
              token_encoder: 0.01
              backbone: 0.01
              modality_heads: 0.01
              output_adapters: 0.01
          freeze:
            token_encoder: true
            backbone: true
            modality_heads: false
            output_adapters: false

