    loader:
      batch_size: 256
    train:
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # ====================================================================================================================
  # Grad-Shafranov loss experiments
  # ====================================================================================================================

  # --------------------------------------------------------------------------------------------------------------------

  task_1-3-data:
    embeddings:
      dct3d:
        tuning:
          finetune:
            objective:
              thresholds:
                output: 0.999  # Put what you want
              max_budget:
                input: 4096
                actuator: 4096
                output: 8192  # Put what you want
    train:
      loss:
        terms:
          - type: native_sparse_mse
            weight: 1.0
          - type: grad_shafranov_residual
            weight: 0.0
            grad_shafranov_params_file: scripts_mast/assets/grad_shafranov/grad_shafranov_params_mast_coo.npz
            loss_type: mse  # Select from: l2 | mse
            grad_shafranov_weights:
              no_gt: 0.5
              lhs_gt: 0.5
              rhs_gt: 0
            rhs_input:
              origin: derived_j_tor  # Select from: derived_j_tor
              calculation_method: GS_operator  # Select from: GS_operator | parametric_approx
            plot_check:
              type: save_plots  # Select from: show_plots | save_plots | <empty>
              probability: 0.0005  # 0.0005
      stages:
        - name: ft_scratch
          epochs: 50

  # --------------------------------------------------------------------------------------------------------------------

  task_1-3-strong:
    embeddings:
      dct3d:
        tuning:
          finetune:
            objective:
              thresholds:
                output: 0.999  # Put what you want
              max_budget:
                input: 4096
                actuator: 4096
                output: 8192  # Put what you want
