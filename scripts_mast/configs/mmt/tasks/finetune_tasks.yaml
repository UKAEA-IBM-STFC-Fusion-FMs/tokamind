# Task-specific finetuning overrides for MMT.
# Tasks omitted here use the shared phase defaults unchanged.

tasks:

  # ====================================================================================================================
  # Standard TokaMark tasks
  # ====================================================================================================================

  # --------------------------------------------------------------------------------------------------------------------

  task_3-2:
    train:
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # --------------------------------------------------------------------------------------------------------------------

  task_3-3:
    preprocess:
      chunks:
        input:
          max_chunks: 21
        actuator:
          max_chunks: 21

  # --------------------------------------------------------------------------------------------------------------------
  # Long-horizon MHD tasks use a smaller batch and coarser training-window sampling. Evaluation retains the shared
  # all-window default.

  task_4-1:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 256
    train:
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # --------------------------------------------------------------------------------------------------------------------

  task_4-2:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
          max_chunks: 40
    loader:
      batch_size: 256
    train:
      loss:
        terms:
          - type: embed_mse
            weight: 1.0

  # --------------------------------------------------------------------------------------------------------------------

  task_4-3:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
        actuator:
