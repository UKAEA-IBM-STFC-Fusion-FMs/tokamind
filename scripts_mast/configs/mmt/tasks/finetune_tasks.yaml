                  calculation_method: GS_operator  
                plot_check:
                  type: save_plots  # Select from: show_plots | save_plots | <empty>
                  probability: 0.0005

          scheduler:
            grad_accum_steps: 1
            warmup_steps_fraction: 0.02

          optimizer:
            lr:
              token_encoder: 5e-3
              backbone: 1e-3
              modality_heads: 5e-3
              output_adapters: 5e-3
            wd:
              token_encoder: 0.01
              backbone: 0.01
              modality_heads: 0.01
              output_adapters: 0.01

