# Task-specific finetuning overrides for MMT.
# Tasks omitted here use the shared phase defaults unchanged.
# Full-scale base experiment: all selected tasks use explicit embed_mse,
# 200 maximum epochs, and validation early stopping after 10 non-improving epochs.

tasks:

  # ---------------------------------------------------------------------------
  # Standard TokaMark tasks
  # ---------------------------------------------------------------------------

  task_1-1:
    train:
      loss:
        terms:
          - type: embed_mse
            weight: 1.0
      early_stop:
        patience: 10
        delta: 0.0
      stages:
        - name: ft_scratch
          epochs: 200

  task_1-2:
    train:
