  task_1-4-weak-two-stage:
    train:
      loss:
        terms:
          - type: native_sparse_mse
            weight: 1.0

      stages:
        - name: ft_scratch
          epochs: 50

          loss:
            terms:
              - type: native_sparse_mse
                weight: 1.0

        - name: gs_loss
          epochs: 50

          loss:
            terms:
              - type: native_sparse_mse
                weight: 1.0
              - type: grad_shafranov_weak_form
                weight: 21e-3
                grad_shafranov_params_file: scripts_mast/assets/grad_shafranov/grad_shafranov_params_mast_coo.npz
                grad_shafranov_weights:
