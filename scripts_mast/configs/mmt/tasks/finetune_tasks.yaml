      chunks:
        input:
          max_chunks: 21
        actuator:
          max_chunks: 21

  # Long-horizon MHD tasks use a smaller batch and coarser training-window
  # sampling. Evaluation retains the shared all-window default.
  task_4-1:
    preprocess:
      valid_windows:
        window_stride_sec: 0.02
      chunks:
        input:
          max_chunks: 40
