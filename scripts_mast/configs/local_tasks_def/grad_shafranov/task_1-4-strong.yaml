# Local GS-loss integration task.
#
# Same signal set/windowing as benchmark task_1-3, with equilibrium-j_tor added as an output so the GS loss can use the
# predicted RHS term.

task_name: task_1-4-strong
task_type: markovian

sources_and_signals:
  input_name: &input_keys
    - - magnetics
      - flux_loop_flux
    - - magnetics
      - b_field_pol_probe_ccbv_field
    - - magnetics
      - b_field_pol_probe_obr_field
    - - magnetics
      - b_field_pol_probe_obv_field
    - - magnetics
      - b_field_tor_probe_saddle_voltage
    - - pf_active
      - coil_current
    - - pf_active
      - solenoid_current
    - - summary
      - ip

  actuator_name:

  output_name: &output_keys
    - - equilibrium
      - psi
    - - equilibrium
      - j_tor

task_window_segmenter:
  input_keys: *input_keys
  actuator_keys:
  output_keys: *output_keys
  input_length: 0.005
  output_length: 0.005
  delta: -0.005

stride_window: 0.001
